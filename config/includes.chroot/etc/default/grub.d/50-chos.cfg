# CHOS : menu de démarrage une fois installé sur le disque.
# (CHOS y apparaît sous le nom « Debian GNU/Linux », sa base.)
# CHOS (1re ligne) démarre par défaut après 10 secondes.
GRUB_DEFAULT=0
GRUB_TIMEOUT=10
# Toujours afficher le menu, pour pouvoir choisir Windows.
GRUB_TIMEOUT_STYLE=menu
# Afficher Windows dans le menu de démarrage (double démarrage).
GRUB_DISABLE_OS_PROBER=false
