# CHOS : pavé tactile des PC portables (toucher pour cliquer, comme sur Windows).
Section "InputClass"
	Identifier "CHOS touchpad"
	MatchIsTouchpad "on"
	Driver "libinput"
	Option "Tapping" "on"
	Option "TappingDrag" "on"
	Option "DisableWhileTyping" "on"
	Option "ClickMethod" "clickfinger"
EndSection
