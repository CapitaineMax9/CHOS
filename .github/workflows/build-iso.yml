name: Construire et tester l'ISO CHOS

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Construction de l'ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Libérer de l'espace disque
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Construire l'ISO (Debian 13 dans Docker)
        run: |
          sudo docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie ./build.sh
          ls -lh out/

      - name: Journal de construction
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-construction
          path: build.log
          if-no-files-found: ignore

      - name: Envoyer l'ISO
        uses: actions/upload-artifact@v4
        with:
          name: chos-iso
          path: out/
          compression-level: 0
          retention-days: 14

  test:
    name: Test dans une machine virtuelle
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: chos-iso
          path: out/

      - name: Installer QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso socat imagemagick
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Démarrer CHOS et vérifier Chrome + l'installateur
        run: tests/qemu-test.sh out/chos-*.iso

      - name: Captures d'écran et journal série
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-test
          path: test-results/

  release:
    name: Publier la version
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: chos-iso
          path: out/

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          body: |
            Image ISO de CHOS. Mode d'emploi : voir le README du dépôt.
